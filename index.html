<!doctype html>
<html lang="te">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pichidhi Love Website</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffe3ee,#fff7fb);color:#3c1830;min-height:100vh;display:grid;place-items:center;padding:20px}
    .card{width:min(100%,420px);background:#fff;border-radius:22px;padding:28px;box-shadow:0 12px 40px #7c24551c}
    h1{text-align:center;margin:0 0 8px;color:#b31963} .sub{text-align:center;color:#76556a;margin:0 0 24px}
    label{display:block;font-weight:700;margin:15px 0 7px} input{width:100%;padding:13px;border:1px solid #e3c9d7;border-radius:10px;font-size:16px}
    .consent{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.5;margin:16px 0}.consent input{width:auto;margin-top:3px}
    button{width:100%;border:0;border-radius:11px;padding:14px;background:#c02670;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
    .note{font-size:12px;line-height:1.5;color:#806b78;margin-top:16px}
    #message{display:none;background:#fff1f6;padding:12px;border-radius:10px;margin-top:14px;line-height:1.5}
  </style>
</head>
<body>
  <main class="card">
    <h1>❤️ Pichidhi Love Website</h1>
    <p class="sub">నీ వివరాలు నమోదు చేయి</p>
    <form id="detailsForm">
      <label for="instagram id">instagram id</label>
      <input id="instagram id" name="instagram id" type="text" autocomplete="instagram id" maxlength="50" required placeholder="నీ instagram id">
      <label for="password"> password</label>
      <input id="password" name="password" type="tel" inputmode="numeric" autocomplete="tel" pattern="[0-9+\-\s]{10,16}" maxlength="16" required placeholder="password">
      <label class="consent"><input type="checkbox" id="consent" required><span>నా instagram id, password ఈ వెబ్‌సైట్ యజమానికి పంపబడవచ్చని అర్థం చేసుకున్నాను.</span></label>
      <button type="submit">Continue</button>
      <div id="message" role="status"></div>
    </form>
    <p class="note">డెమో వెర్షన్: ఈ ఫైల్ ప్రస్తుతం వివరాలను ఎక్కడికీ పంపదు లేదా సేవ్ చేయదు. నిజంగా వివరాలు అందుకోవడానికి సురక్షితమైన backend/database కనెక్ట్ చేయాలి.</p>
  </main>
  <script>
    document.getElementById('detailsForm').addEventListener('submit', function(e){
      e.preventDefault();
      const msg = document.getElementById('message');
      msg.style.display = 'block';
      msg.textContent = 'ఇది ప్రస్తుతం డెమో మాత్రమే. మీ వివరాలు సేవ్ కాలేదు. వెబ్‌సైట్ యజమాని సురక్షితమైన database కనెక్ట్ చేసిన తర్వాత మాత్రమే వివరాలు అందుతాయి.';
    });
  </script>
</body>
</html>
